name: cra
x-runtime: &runtime
  image: ${CRA_API_IMAGE:?immutable API digest required}
  pull_policy: never
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  env_file: [./local/api.env]
  networks: [backend]
  volumes: ["${CRA_MAINTENANCE_ROOT:?maintenance root required}/control:/var/lib/cra-maintenance:ro"]
services:
  api:
    <<: *runtime
    restart: "no"
    command: [node, apps/api/dist/main.js]
    environment: {CRA_SERVICE_ID: api, CRA_IMAGE_ID: "${CRA_API_IMAGE_ID:?exact image ID required}", CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
    volumes:
      - "${CRA_MAINTENANCE_ROOT}/control:/var/lib/cra-maintenance:ro"
      - "${CRA_MAINTENANCE_ROOT}/acks/api:/var/lib/cra-maintenance-ack"
  agent-ingress:
    <<: *runtime
    restart: "no"
    command: [node, apps/api/dist/agent-main.js]
    environment: {CRA_SERVICE_ID: agent-ingress, CRA_IMAGE_ID: "${CRA_API_IMAGE_ID:?exact image ID required}", CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
    volumes:
      - "${CRA_MAINTENANCE_ROOT}/control:/var/lib/cra-maintenance:ro"
      - "${CRA_MAINTENANCE_ROOT}/acks/agent-ingress:/var/lib/cra-maintenance-ack"
      - ./local/agent-tls:/run/cra-agent:ro
  web:
    image: ${CRA_WEB_IMAGE:?immutable web digest required}
    pull_policy: never
    restart: unless-stopped
    env_file: [./local/web.env]
    networks: [backend]
  edge:
    image: ${CRA_EDGE_IMAGE:?immutable edge digest required}
    pull_policy: never
    restart: unless-stopped
    command: [node, deployment/edge.mjs]
    environment: {CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
    ports: ["127.0.0.1:8080:8080", "3443:3444"]
    volumes:
      - "${CRA_MAINTENANCE_ROOT}/control:/var/lib/cra-maintenance:ro"
      - "${CRA_MAINTENANCE_ROOT}/acks/edge:/var/lib/cra-maintenance-ack"
    networks: [backend]
  operator-api:
    <<: *runtime
    profiles: [control]
    command: [node, apps/api/dist/operator-main.js]
    env_file: [./local/operator.env]
    ports: ["127.0.0.1:3334:3334"]
  operator-web:
    image: ${CRA_OPERATOR_IMAGE:?immutable operator digest required}
    pull_policy: never
    profiles: [control]
    ports: ["127.0.0.1:3002:8080"]
  agent:
    image: ${CRA_AGENT_IMAGE:?immutable agent digest required}
    pull_policy: never
    profiles: [agent]
    restart: unless-stopped
    command: [node, apps/agent/dist/main.js, serve, --config, /etc/cra-agent/config.json]
    environment: {CRA_SERVICE_ID: agent, CRA_IMAGE_ID: "${CRA_AGENT_IMAGE_ID:?exact image ID required}", CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
    volumes:
      - ./local/agent:/etc/cra-agent:ro
      - "${CRA_AGENT_STATE_ROOT:?agent state root}:/var/lib/cra-agent"
      - "${CRA_MAINTENANCE_ROOT}/control:/var/lib/cra-maintenance:ro"
      - "${CRA_MAINTENANCE_ROOT}/acks/agent:/var/lib/cra-maintenance-ack"
    networks: [backend]
  audit-export-worker:
    <<: *runtime
    profiles: [workers]
    command: [node, apps/api/dist/audit-export-worker.js]
    environment: {CRA_SERVICE_ID: audit-export-worker, CRA_IMAGE_ID: "${CRA_API_IMAGE_ID:?exact image ID required}", CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
    volumes:
      - "${CRA_MAINTENANCE_ROOT}/control:/var/lib/cra-maintenance:ro"
      - "${CRA_MAINTENANCE_ROOT}/acks/audit-export-worker:/var/lib/cra-maintenance-ack"
  audit-range-verify-worker:
