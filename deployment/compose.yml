    environment: {CRA_SERVICE_ID: audit-range-verify-worker, CRA_IMAGE_ID: "${CRA_API_IMAGE_ID:?exact image ID required}", CRA_MAINTENANCE_DIRECTORY: /var/lib/cra-maintenance, CRA_MAINTENANCE_ACK_DIRECTORY: /var/lib/cra-maintenance-ack}
